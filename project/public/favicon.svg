<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer ring / alignment marks -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Crosshairs -->
  <line x1="50" y1="0" x2="50" y2="100" stroke="#00a2e8" stroke-width="2" />
  <line x1="0" y1="50" x2="100" y2="50" stroke="#ec008c" stroke-width="2" />
  
  <!-- CMYK 4 Quadrants -->
  <!-- Top Left: Cyan -->
  <path d="M 50 50 L 50 6 A 44 44 0 0 0 6 50 Z" fill="#00a2e8" />
  <!-- Top Right: Yellow -->
  <path d="M 50 50 L 94 50 A 44 44 0 0 0 50 6 Z" fill="#ffc90e" />
  <!-- Bottom Left: Magenta -->
  <path d="M 50 50 L 6 50 A 44 44 0 0 0 50 94 Z" fill="#ec008c" />
  <!-- Bottom Right: Black / Key -->
  <path d="M 50 50 L 50 94 A 44 44 0 0 0 94 50 Z" fill="#1e293b" />

  <!-- Inner stylized LPA letters -->
  <!-- 'L' in top left -->
  <path d="M 24 20 L 30 20 L 30 40 L 44 40 L 44 44 L 24 44 Z" fill="#ffffff" filter="url(#shadow)" />
  <!-- 'P' in bottom left -->
  <path d="M 24 56 L 38 56 Q 44 56 44 65 Q 44 74 38 74 L 30 74 L 30 84 L 24 84 Z M 30 62 L 30 68 L 37 68 Q 39 68 39 65 Q 39 62 37 62 Z" fill="#ffffff" filter="url(#shadow)" />
  <!-- 'A' in right half -->
  <path d="M 68 20 L 76 20 L 88 80 L 81 80 L 78 64 L 64 64 L 61 80 L 55 80 Z M 71 34 L 66 58 L 76 58 Z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Center registration circle -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
</svg>
